# Recast packaging — every installer target from docs/packaging.md.
# Binaries under resources/ffmpeg/<platform>-<arch>/ ship via extraResources
# and are asar-unpacked so they stay executable. Never commit those binaries.
appId: app.recast.desktop
productName: Recast
# The binary is named `recast` (canonical, see the master build prompt).
# Without this, electron-builder derives an unsafe name from the scoped npm
# package name (@recast/desktop) and AppImage/NSIS refuse to build.
executableName: recast
copyright: Copyright © 2025-2026 Recast contributors
directories:
  output: ../../release
  buildResources: build
files:
  - out/**
  - "!**/*.map"
  - "!node_modules/**/test/**"
asarUnpack:
  - "node_modules/better-sqlite3/**"
# Per-platform extraResources: electron-builder resolves ${os} differently per
# platform ("mac" vs process.platform "darwin"), while the runtime resolver
# (packages/shared/src/ffmpeg/resolve.ts) always uses process.platform names
# (darwin/win32/linux). Pinning the platform dir per section keeps both in
# sync. Binaries under resources/ffmpeg/<platform>-<arch>/ are staged by
# scripts/fetch-ffmpeg.mjs and never committed.
extraResources:
  - from: build/entitlements.mac.plist
    to: entitlements.mac.plist
protocols:
  - name: Recast
    schemes:
      - recast
publish:
  provider: github
  owner: SudhirDevOps1
  repo: recast
  releaseType: release

# ---------------- Windows ----------------
win:
  artifactName: Recast-Setup-${version}${env.ARCH_SUFFIX}.${ext}
  extraResources:
    - from: ../../resources/ffmpeg/win32-${arch}
      to: ffmpeg/win32-${arch}
      filter:
        - "**/*"
    - from: ../../resources/ffmpeg/LICENSE.txt
      to: ffmpeg/LICENSE.txt
    - from: ../../resources/whisper/win32-${arch}
      to: whisper/win32-${arch}
      filter:
        - "**/*"
  target:
    - target: nsis
    - target: msi
    - target: portable
# Per-target arch lists are intentionally absent: the build matrix drives arch
# per job via the CLI (--x64 / --arm64). A config-level arch list overrides the
# CLI and makes the arm64 leg produce x64 artifacts.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Recast
  artifactName: Recast-Setup-${version}${env.ARCH_SUFFIX}.${ext}
  uninstallDisplayName: Recast
msi:
  perMachine: true
  artifactName: Recast-${version}-enterprise${env.ARCH_SUFFIX}.${ext}
  oneClick: false
portable:
  artifactName: Recast-Portable-${version}${env.ARCH_SUFFIX}.${ext}
  unicode: true

# ---------------- macOS ----------------
mac:
  category: public.app-category.video
  artifactName: Recast-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extraResources:
    - from: ../../resources/ffmpeg/darwin-${arch}
      to: ffmpeg/darwin-${arch}
      filter:
        - "**/*"
    - from: ../../resources/ffmpeg/LICENSE.txt
      to: ffmpeg/LICENSE.txt
  target:
    - target: dmg
    - target: zip
# The `pkg` (MDM) target is temporarily removed from the build: electron-builder
# 26.18 fails it at the final productbuild step ("ENOENT ... unlink
# app.recast.desktop.pkg") on unsigned CI builds. Re-add alongside signing
# (docs/code-signing.md) and verify on a real macOS pass. The config block below
# stays for that re-enable.
dmg:
  artifactName: Recast-${version}-${arch}.${ext}
  title: Recast ${version}
  writeUpdateInfo: true
pkg:
  artifactName: Recast-${version}-${arch}.pkg

# ---------------- Linux ----------------
linux:
  artifactName: Recast-${version}-${arch}.${ext}
  category: Video
  extraResources:
    - from: ../../resources/ffmpeg/linux-${arch}
      to: ffmpeg/linux-${arch}
      filter:
        - "**/*"
    - from: ../../resources/ffmpeg/LICENSE.txt
      to: ffmpeg/LICENSE.txt
  desktop:
    entry:
      Name: Recast
      Comment: Record, auto-zoom, caption, export — locally.
      StartupWMClass: Recast
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  artifactName: Recast-${version}-${arch}.${ext}
deb:
  artifactName: Recast-${version}-${arch}.deb
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
rpm:
  artifactName: Recast-${version}-${arch}.rpm
