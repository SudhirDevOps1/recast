name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub's release-asset CDN intermittently returns 502/503/504 (CI #63
# smoke 504'd fetching the electron-v45.2.3 dist zip). npmmirror hosts the
# exact same artifacts; @electron/get and electron-builder both honor
# these env vars natively.
env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        name: Detect application code
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "Application code detected."
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "Specification-only repository — skipping app jobs."
          fi

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files exist
        run: |
          set -e
          required="README.md LICENSE AGENTS.md CONTRIBUTING.md SECURITY.md STATUS.md PERFORMANCE.md SPIKE-RESULTS.md CHANGELOG.md \
            docs/README.md docs/architecture.md docs/recording.md docs/editing.md docs/export.md docs/ffmpeg.md \
            docs/platform-support.md docs/build.md docs/packaging.md docs/code-signing.md docs/keyboard-shortcuts.md \
            docs/troubleshooting.md docs/roadmap.md docs/deployment.md docs/security.md docs/support.md \
            prompts/build-prompt.md apps/website/index.html"
          missing=0
          for f in $required; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required document is missing"
              missing=1
            fi
          done
          exit $missing

      - name: No placeholder branding
        run: |
          if grep -rInE "(my-app|electron-app|TODO: APP NAME|ChangeMe)" --include="*.md" . ; then
            echo "::error::placeholder branding found"
            exit 1
          fi
          echo "branding ok"

      - name: Documentation links and anchors
        run: node scripts/check-docs.mjs

  verify:
    name: Lint, types, tests
    needs: [preflight, docs]
    if: needs.preflight.outputs.has_app == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-14 jobs cancel instantly on this repo (image withdrawn for new
        # use); macos-15 is the supported arm64 image — see STATUS.md.
        os: [ubuntu-22.04, windows-latest, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Use a node-gyp that recognizes VS 2026 (image ships VS 18)
        if: runner.os == 'Windows'
        run: |
          npm install -g node-gyp@latest
          "npm_config_node_gyp=$(npm root -g)\node-gyp\bin\node-gyp.js" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  smoke:
    name: Smoke (ubuntu-22.04)
    needs: [preflight, verify]
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies for Electron + native build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libasound2 libgbm1 libxkbcommon0 xvfb libx11-dev libxtst-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev pkg-config ffmpeg

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Rebuild native modules for the Electron ABI
        run: pnpm --filter @recast/desktop exec electron-builder install-app-deps

      # Playwright auto-downloads the Electron binary inside the test when it
      # is missing, which eats the firstWindow timeout — make sure the binary
      # exists before the test runs.
      - name: Ensure Electron binary is present
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Run smoke test (launch → bridge → library)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm smoke
        env:
          RECAST_SMOKE: '1'
          # Forward the Electron main-process console into the CI log so a
          # silent startup failure is diagnosable in one round trip.
          DEBUG: 'pw:electron'
