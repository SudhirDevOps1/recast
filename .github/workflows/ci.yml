name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        name: Detect application code
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "Application code detected."
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "Specification-only repository — skipping app jobs."
          fi

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files exist
        run: |
          set -e
          required="README.md LICENSE AGENTS.md CONTRIBUTING.md SECURITY.md STATUS.md PERFORMANCE.md CHANGELOG.md \
            docs/README.md docs/architecture.md docs/recording.md docs/editing.md docs/export.md docs/ffmpeg.md \
            docs/platform-support.md docs/build.md docs/packaging.md docs/code-signing.md docs/keyboard-shortcuts.md \
            docs/troubleshooting.md docs/roadmap.md prompts/build-prompt.md apps/website/index.html"
          missing=0
          for f in $required; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required document is missing"
              missing=1
            fi
          done
          exit $missing

      - name: No placeholder branding
        run: |
          if grep -rInE "(my-app|electron-app|TODO: APP NAME|ChangeMe)" --include="*.md" . ; then
            echo "::error::placeholder branding found"
            exit 1
          fi
          echo "branding ok"

  verify:
    name: Lint, types, tests
    needs: [preflight, docs]
    if: needs.preflight.outputs.has_app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, windows-11-arm, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  smoke:
    name: Smoke (ubuntu-22.04)
    needs: [preflight, verify]
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libasound2 libgbm1 libxkbcommon0 xvfb

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run smoke test (launch → bridge → library)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm smoke
        env:
          RECAST_SMOKE: '1'
