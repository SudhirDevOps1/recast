name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version to release (e.g. v0.0.2)'
        required: false
        default: 'v0.0.2'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: win-x64, script: dist:win, arch_suffix: '', ffmpeg_target: win32-x64 }
          - { os: windows-11-arm, name: win-arm64, script: dist:win:arm64, arch_suffix: '-arm64', ffmpeg_target: win32-arm64 }
          # macos-14 jobs cancel instantly on this repo (image withdrawn for
          # new use); macos-15 is the supported arm64 image — see STATUS.md.
          - { os: macos-15, name: mac-arm64, script: dist:mac:arm64, arch_suffix: '', ffmpeg_target: darwin-arm64 }
          # No Intel macOS runners remain; darwin-x64 is cross-compiled on
          # arm64 hardware.
          - { os: macos-15, name: mac-x64, script: dist:mac:x64, arch_suffix: '', ffmpeg_target: darwin-x64 }
          - { os: ubuntu-22.04, name: linux-x64, script: dist:linux, arch_suffix: '', ffmpeg_target: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Artifacts are unsigned until certificates are configured. Do NOT map
      # absent secrets to env here: GitHub injects empty strings and
      # electron-builder treats CSC_LINK='' as a file path ("not a file").
      # When certificates arrive, add the env block from docs/code-signing.md
      # ("CI signing environment") and flip the flag below to 'true'.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Install X11 dev headers (uiohook native rebuild)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxkbcommon-dev pkg-config

      - name: Use a node-gyp that recognizes VS 2026 (image ships VS 18)
        if: runner.os == 'Windows'
        run: |
          npm install -g node-gyp@latest
          "npm_config_node_gyp=$(npm root -g)\node-gyp\bin\node-gyp.js" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '~/.cache/electron' || (runner.os == 'macOS' && '~/Library/Caches/electron' || '%LOCALAPPDATA%\electron\Cache') }}
          key: electron-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '~/.cache/electron-builder' || (runner.os == 'macOS' && '~/Library/Caches/electron-builder' || '%LOCALAPPDATA%\electron-builder\Cache') }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Cache FFmpeg binaries
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('ffmpeg.lock.json') }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm ffmpeg:fetch ${{ matrix.ffmpeg_target }}
      - run: pnpm --filter @recast/desktop build

      - name: Build installers (${{ matrix.script }})
        run: pnpm ${{ matrix.script }}
        env:
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}

      - name: AppImage smoke (extract + FFmpeg payload check)
        if: runner.os == 'Linux'
        run: |
          cd release
          APPIMAGE=$(ls Recast-*.AppImage | head -1)
          # ./ prefix is required: without it bash searches PATH instead of
          # executing the file in the current directory (exit 127).
          ./"$APPIMAGE" --appimage-extract >/dev/null
          test -f squashfs-root/resources/ffmpeg/linux-x64/ffmpeg
          echo "AppImage smoke OK: $APPIMAGE (FFmpeg payload present)"
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          # Explicit file list: a bare release/* also uploads the *-unpacked
          # staging directories, which breaks the SHA256SUMS step downstream.
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > SHA256SUMS
          echo "Checksums:"
          cat SHA256SUMS

      - name: Publish GitHub release
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Recast ${TAG#v}" \
            --notes "Download the installer for your platform below. \`latest.yml\` / \`latest-mac.yml\` are the electron-updater feeds.

          Installers are **unsigned** until signing certificates are configured (see docs/code-signing.md). Windows may show SmartScreen; macOS requires right-click → Open on first launch.

          Verify downloads: \`sha256sum -c SHA256SUMS\`" \
            artifacts/*
