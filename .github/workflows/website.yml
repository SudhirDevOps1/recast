name: Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'scripts/check-website.mjs'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The site ships without a build step, so this is the only gate between a
      # typo in an href and a 404 in production.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check markup and assets
        run: node scripts/check-website.mjs

      # A workflow token cannot create the Pages site (needs an admin). Fail
      # loudly with the exact one-time fix instead of a cryptic 403.
      - name: Verify Pages is enabled (one-time admin step)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled yet. One-time fix (10 seconds): Settings → Pages → Build and deployment → Source: GitHub Actions — see docs/repository-setup.md. Then re-run this workflow."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website

      - id: deployment
        uses: actions/deploy-pages@v5
