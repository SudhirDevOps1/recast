name: Bug report
description: Something in Recast is broken
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach personal recordings — a short synthetic capture is enough.

  - type: input
    id: version
    attributes:
      label: Recast version
      description: Settings → About, or the installer filename
      placeholder: 0.0.3 (build abc1234)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Windows 11 ARM64
        - macOS 12
        - macOS 13
        - macOS 14
        - macOS 15
        - Linux X11
        - Linux Wayland
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware and display scaling
      placeholder: ThinkPad T14, 1920x1080 @ 150%, second display 2560x1440 @ 100%
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Recast
        2. Choose "Window"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / capture
        - Audio
        - Face cam
        - Editing / timeline
        - Zoom / cursor
        - Captions
        - Export
        - Installer / update
        - UI / performance
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or session.json
      description: Settings → Diagnostics → Copy last session. Redact file paths if needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: I am not sharing personal or confidential recordings
          required: true
